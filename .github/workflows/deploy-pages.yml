name: Deploy to GitHub Pages

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'playwright-report/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/sync-patterns.yml'
      - '.github/workflows/auto-merge-patterns.yml'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'next-sitemap.config.js'
      - '!**/*.md'  # Exclude markdown files
  pull_request:
    branches: [ dev ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'playwright-report/**'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/sync-patterns.yml'
      - '.github/workflows/auto-merge-patterns.yml'
      - 'next.config.*'
      - 'tsconfig.json'
      - 'next-sitemap.config.js'
      - '!**/*.md'  # Exclude markdown files
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job - runs first
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build with Next.js
        run: npm run build
        
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Test job - runs after build succeeds
  test:
    runs-on: ubuntu-latest
    needs: build  # Wait for build to complete
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./out

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Deployment job - runs after build AND test succeed
  deploy:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]  # Wait for both build and test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
