name: Auto-Merge Pattern Sync PRs

on:
  workflow_run:
    workflows:
      - "Sync Patterns from Upstream"
    types:
      - completed

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    
    permissions:
      contents: write
      pull-requests: write
      checks: read
    
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      
      - name: Find pattern sync PR
        id: find-pr
        run: |
          # Find the PR created by the sync workflow
          PR_NUMBER=$(gh pr list --state open --label "automated" --label "patterns" --label "upstream-sync" --json number --jq '.[0].number')
          
          if [ -z "$PR_NUMBER" ]; then
            echo "No pattern sync PR found"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Found PR #$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        if: steps.find-pr.outputs.found == 'true'
        run: npm ci
      
      - name: Type check
        if: steps.find-pr.outputs.found == 'true'
        run: |
          echo "Running TypeScript check..."
          npx tsc --noEmit 2>&1 | head -20 || true
      
      - name: Validate pattern syntax
        if: steps.find-pr.outputs.found == 'true'
        run: |
          echo "Validating pattern files..."
          if npx tsc --noEmit src/app/utils/patterns/*.ts 2>&1 | grep -q "error"; then
            echo "TypeScript errors found in pattern files"
            exit 1
          fi
          echo "Pattern files are valid TypeScript"
      
      - name: Build project
        if: steps.find-pr.outputs.found == 'true'
        run: |
          echo "Building project..."
          npm run build 2>&1 | tail -20

      
      - name: Enable auto-merge
        if: steps.find-pr.outputs.found == 'true'
        run: |
          gh pr merge ${{ steps.find-pr.outputs.pr_number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Post success comment
        if: steps.find-pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ steps.find-pr.outputs.pr_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Auto-Merge Enabled
            
            This pattern sync PR has been:
            - ✅ Type-checked
            - ✅ Built successfully  
            - ✅ Auto-merge enabled (squash)
            
            **Note:** Auto-merge will complete once all required checks pass.
            
            If you need to cancel, run: \`gh pr merge ${{ steps.find-pr.outputs.pr_number }} --disable-auto\``
            })
